services:
  # Backend service (API and core logic)
${1}vl:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: vl-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "${VL_BACKEND_PORT:-${NOFX_BACKEND_PORT:-8080}}:8080"
      - "6060:6060"  # pprof profiling
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - vl-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  vl-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: vl-frontend
    restart: unless-stopped
    ports:
      - "${VL_FRONTEND_PORT:-${NOFX_FRONTEND_PORT:-3000}}:80"
    networks:
      - vl-network
    depends_on:
${1}- vl
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  vl-network:
    driver: bridge
