# VL Stable Release Deployment
# Production-ready stable version

services:
${1}vl:
    image: ghcr.io/nofxaios/nofx/nofx-backend:stable
    container_name: vl-trading
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${VL_BACKEND_PORT:-${NOFX_BACKEND_PORT:-8080}}:8080"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - vl-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  vl-frontend:
    image: ghcr.io/nofxaios/nofx/vl-frontend:stable
    container_name: vl-frontend
    restart: unless-stopped
    ports:
      - "${VL_FRONTEND_PORT:-${NOFX_FRONTEND_PORT:-3000}}:80"
    networks:
      - vl-network
    depends_on:
${1}- vl
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  vl-network:
    driver: bridge
